# En-têtes de sécurité de toutes les réponses (le TLS est terminé par Traefik).
# CSP : seuls le site et PayPal (bouton d'abonnement) peuvent fournir du script ; les polices sont
# servies par le site ; la vérification de mot de passe interroge api.pwnedpasswords.com (k-anonymat).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.paypal.com https://*.paypalobjects.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.pwnedpasswords.com https://*.paypal.com https://*.paypalobjects.com; frame-src https://*.paypal.com https://*.paypalobjects.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), usb=(), payment=(self \"https://www.paypal.com\")" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
