server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript application/manifest+json image/svg+xml;

    # Un add_header dans une location annule ceux du niveau serveur : chaque location inclut les en-têtes.
    include /etc/nginx/snippets/security-headers.conf;

    # Fichiers de build avec hash dans le nom : cache long
    location /static/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Icônes et image de partage : cache d'une semaine
    location ~* ^/(favicon\.ico|favicon-32\.png|apple-touch-icon\.png|icon-[a-z0-9-]+\.png|og-image\.png)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }
    location = /manifest.webmanifest { default_type application/manifest+json; try_files $uri =404; }

    # SPA : toute route inconnue renvoie index.html ; HTML jamais mis en cache
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
